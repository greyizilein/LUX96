    <!-- ============ DELIVERY ============ -->
    <section class="delivery" id="delivery">
      <div class="wrap delivery-grid">
        <div class="delivery-copy">
          {{CRUMBS}}
          <p class="label sec-label">Where we deliver</p>
          <h1 class="display">From our bench<br>to your <em>door</em>.</h1>
          <p class="delivery-sub">Every piece leaves the workshop wrapped, blanketed and carried by our own team or a trusted carrier. Tap a state to check it.</p>
          <div class="delivery-legend">
            <span><i class="lg lg-del"></i>We deliver</span>
            <span class="lg-inst-wrap"><i class="lg lg-inst"></i>Delivery &amp; on-site installation</span>
          </div>
          <p class="delivery-state" aria-live="polite"><span class="label">Selected</span><b class="ds-name">—</b><span class="ds-note"></span></p>
          <a class="btn btn-line btn-sm c-wa" data-msg="Do you deliver to my area? I'm in " href="https://wa.me/2348167993933" target="_blank" rel="noopener">Ask about your area</a>
        </div>
        <figure class="ng-map">
          <svg viewBox="0 0 744 600" role="group" aria-label="Map of Nigeria showing delivery coverage"></svg>
          <figcaption class="map-credit">Map: <a href="https://github.com/VictorCazanave/svg-maps" target="_blank" rel="noopener">svg-maps</a> (based on MapSVG), CC BY 4.0</figcaption>
        </figure>
      </div>
    </section>
