<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — LUX96 Furnitures</title>
  <meta name="theme-color" content="#120e0b">
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;display:grid;place-items:center;background:#120e0b;color:#efe7da;font-family:"Manrope",system-ui,sans-serif;text-align:center;padding:24px}
    img{width:64px;height:64px;margin:0 auto 26px;animation:spin 18s linear infinite}
    p.l{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c8a165}
    h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(46px,10vw,96px);line-height:.95;margin:16px 0}
    h1 em{color:#e6c58a}
    p.s{color:#b9ad9c;max-width:26em;margin:0 auto 28px}
    button{padding:14px 26px;border-radius:999px;border:0;background:#c8a165;color:#120e0b;font:500 15px "Manrope",system-ui,sans-serif;cursor:pointer}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <img src="assets/img/logo.svg" alt="">
    <p class="l">You're offline</p>
    <h1>The workshop<br><em>is still here.</em></h1>
    <p class="s">This page isn't saved on your phone yet. Pages you've already opened still work — reconnect to see the rest.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
